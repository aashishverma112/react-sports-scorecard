name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*'] # Trigger release on version tags
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.19.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build library
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/react-sports-scorecard.js
          test -f dist/react-sports-scorecard.umd.cjs
          test -f dist/index.d.ts
          echo "All expected dist artifacts present."

  publish-to-npm:
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v') # Only run on version tags
    runs-on: ubuntu-latest
    
    # Required permissions for Trusted Publishing (OIDC)[cite: 1]
    permissions:
      id-token: write #[cite: 1]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Publish to npm
        run: npm publish
